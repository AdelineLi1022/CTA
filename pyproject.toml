[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cta-lvo"
version = "0.1.0"
description = "ISLES24 sparse LVO localization research pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "nibabel>=5.2", "pyarrow>=15", "huggingface-hub>=0.25"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cta-lvo = "cta_lvo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
